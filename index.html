<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="theme-color" content="#0a0a0a"/>
  <title>Фото Галерея</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0; padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --gold: #c9a96e;
      --text: #ede8e0;
      --muted: #6b6560;
      --card: #161616;
      --border: #2a2a2a;
    }

    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      background: #0a0a0a;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      display: none;
      position: fixed; inset: 0;
    }
    .page.active { display: block; }

    /* ── HOME ── */
    #home {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      background: linear-gradient(160deg, #111210 0%, #0a0b0a 100%);
    }

    .brand {
      text-align: center;
      margin-bottom: 2.5rem;
    }
    .brand-line {
      width: 36px; height: 2px;
      background: var(--gold);
      margin: 0 auto 1.2rem;
    }
    .brand h1 {
      font-size: 2.4rem;
      font-weight: 700;
      letter-spacing: -.01em;
    }
    .brand h1 span { color: var(--gold); }
    .brand p {
      margin-top: .4rem;
      font-size: .7rem;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .home-btns {
      width: 100%; max-width: 320px;
      display: flex; flex-direction: column; gap: .9rem;
    }

    .home-btn {
      display: flex; align-items: center; gap: .9rem;
      padding: 1.2rem 1.2rem;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: .95rem;
      cursor: pointer;
      -webkit-user-select: none; user-select: none;
    }
    .home-btn:active {
      background: #1e1e1e;
      border-color: var(--gold);
    }
    .btn-icon { font-size: 1.4rem; }
    .btn-info { flex: 1; text-align: left; }
    .btn-title { display: block; font-weight: 600; font-size: .95rem; }
    .btn-sub { display: block; font-size: .7rem; color: var(--muted); margin-top: .1rem; }
    .btn-arr { color: var(--muted); font-size: 1.2rem; }

    /* ── SLIDER ── */
    #page-shapka, #page-darvoza {
      background: #000;
    }

    .sl-header {
      position: absolute; top: 0; left: 0; right: 0; z-index: 10;
      display: flex; align-items: center; gap: .6rem;
      padding: .8rem 1rem;
      background: linear-gradient(to bottom, rgba(0,0,0,.85), transparent);
    }
    .sl-header h2 {
      font-size: 1.1rem; font-weight: 600; flex: 1;
      text-shadow: 0 1px 4px #000;
    }
    .sl-counter {
      font-size: .7rem; letter-spacing: .1em;
      color: rgba(255,255,255,.5);
    }

    .sl-img-wrap {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 68px;
      display: flex; align-items: center; justify-content: center;
    }
    .sl-img-wrap img {
      max-width: 100%; max-height: 100%;
      width: auto; height: auto;
      object-fit: contain;
      display: block;
      transition: opacity .18s;
    }
    .sl-img-wrap img.fade { opacity: 0; }

    .sl-prev, .sl-next {
      position: absolute; top: 50%; transform: translateY(-50%);
      z-index: 10;
      width: 52px; height: 76px;
      background: rgba(0,0,0,.55);
      border: 1px solid rgba(255,255,255,.15);
      color: #fff; font-size: 2rem;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      -webkit-user-select: none; user-select: none;
    }
    .sl-prev { left: 0; border-left: none; border-radius: 0 6px 6px 0; }
    .sl-next { right: 0; border-right: none; border-radius: 6px 0 0 6px; }
    .sl-prev:active, .sl-next:active {
      background: rgba(201,169,110,.4);
      border-color: var(--gold);
    }

    .sl-bottom {
      position: absolute; bottom: 0; left: 0; right: 0; z-index: 10;
      padding: .5rem .8rem calc(.5rem + env(safe-area-inset-bottom, 0px));
      background: linear-gradient(to top, rgba(0,0,0,.8), transparent);
    }
    .sl-back {
      width: 100%; padding: .9rem;
      background: rgba(22,22,22,.9);
      border: 1px solid rgba(255,255,255,.12);
      color: var(--text);
      font-size: .95rem; font-weight: 500;
      display: flex; align-items: center; justify-content: center; gap: .4rem;
      cursor: pointer;
      -webkit-user-select: none; user-select: none;
    }
    .sl-back:active { border-color: var(--gold); background: #222; }
  </style>
</head>
<body>

<!-- HOME -->
<div class="page active" id="home">
  <div class="brand">
    <div class="brand-line"></div>
    <h1>Фото <span>Галерея</span></h1>
    <p>Коллекция фотографий</p>
  </div>
  <div class="home-btns">
    <button class="home-btn" onclick="openSlider('shapka')">
      <span class="btn-icon">🏔️</span>
      <span class="btn-info">
        <span class="btn-title">Шапка</span>
        <span class="btn-sub">40 фотографий</span>
      </span>
      <span class="btn-arr">›</span>
    </button>
    <button class="home-btn" onclick="openSlider('darvoza')">
      <span class="btn-icon">🚪</span>
      <span class="btn-info">
        <span class="btn-title">Дарвоза хона</span>
        <span class="btn-sub">25 фотографий</span>
      </span>
      <span class="btn-arr">›</span>
    </button>
  </div>
</div>

<!-- ШАПКА -->
<div class="page" id="page-shapka">
  <div class="sl-header">
    <span>🏔️</span>
    <h2>Шапка</h2>
    <span class="sl-counter" id="ctr-shapka">1 / 40</span>
  </div>
  <div class="sl-img-wrap">
    <img id="img-shapka" src="" alt=""/>
  </div>
  <button class="sl-prev" onclick="slide('shapka',-1)">&#8249;</button>
  <button class="sl-next" onclick="slide('shapka',1)">&#8250;</button>
  <div class="sl-bottom">
    <button class="sl-back" onclick="goHome()">&#8592; Назад</button>
  </div>
</div>

<!-- ДАРВОЗА ХОНА -->
<div class="page" id="page-darvoza">
  <div class="sl-header">
    <span>🚪</span>
    <h2>Дарвоза хона</h2>
    <span class="sl-counter" id="ctr-darvoza">1 / 25</span>
  </div>
  <div class="sl-img-wrap">
    <img id="img-darvoza" src="" alt=""/>
  </div>
  <button class="sl-prev" onclick="slide('darvoza',-1)">&#8249;</button>
  <button class="sl-next" onclick="slide('darvoza',1)">&#8250;</button>
  <div class="sl-bottom">
    <button class="sl-back" onclick="goHome()">&#8592; Назад</button>
  </div>
</div>

<script>
var SEC = {
  shapka:  { count: 40, dir: 'images/shapka'  },
  darvoza: { count: 25, dir: 'images/darvoza' }
};
var cur = { shapka: 0, darvoza: 0 };
var loaded = {};
var inited = {};

function src(name, i) {
  return SEC[name].dir + '/' + (i + 1) + '.jpg';
}

function preload(name, i) {
  var n = SEC[name].count;
  [0,1,2,-1].forEach(function(o) {
    var idx = ((i + o) % n + n) % n;
    var s = src(name, idx);
    if (!loaded[s]) {
      var im = new Image();
      im.src = s;
      loaded[s] = 1;
    }
  });
}

function setSlide(name, i) {
  var n = SEC[name].count;
  cur[name] = ((i % n) + n) % n;
  var img = document.getElementById('img-' + name);
  var s = src(name, cur[name]);
  img.classList.add('fade');
  var tmp = new Image();
  tmp.onload = tmp.onerror = function() {
    img.src = s;
    img.classList.remove('fade');
  };
  tmp.src = s;
  document.getElementById('ctr-' + name).textContent = (cur[name] + 1) + ' / ' + n;
  preload(name, cur[name]);
}

function slide(name, d) { setSlide(name, cur[name] + d); }

function openSlider(name) {
  document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
  document.getElementById('page-' + name).classList.add('active');
  if (!inited[name]) { inited[name] = 1; setSlide(name, 0); }
}

function goHome() {
  document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
  document.getElementById('home').classList.add('active');
}

// Swipe
var tx = 0, ty = 0;
document.addEventListener('touchstart', function(e) {
  tx = e.touches[0].clientX;
  ty = e.touches[0].clientY;
}, {passive:true});
document.addEventListener('touchend', function(e) {
  var ap = document.querySelector('#page-shapka.active, #page-darvoza.active');
  if (!ap) return;
  var dx = tx - e.changedTouches[0].clientX;
  var dy = Math.abs(ty - e.changedTouches[0].clientY);
  if (Math.abs(dx) > 40 && Math.abs(dx) > dy) slide(ap.id.replace('page-',''), dx > 0 ? 1 : -1);
}, {passive:true});

// Keyboard
document.addEventListener('keydown', function(e) {
  var ap = document.querySelector('#page-shapka.active, #page-darvoza.active');
  if (!ap) return;
  var name = ap.id.replace('page-','');
  if (e.key === 'ArrowLeft') slide(name,-1);
  if (e.key === 'ArrowRight') slide(name,1);
  if (e.key === 'Escape') goHome();
});
</script>
</body>
</html>
